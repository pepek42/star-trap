setting_aim_mode=Aim mode
setting_aim_mode_hint=Mouse: the mouse steers the hull, LMB fires, RMB thrusts. Twin-stick: WASD picks the thrust direction, the hull turns and thrusts as it lines up, the mouse aims a turret, LMB fires. Auto-aim: steer and thrust the same way, the guns pick a target ahead and fire on their own.
