setting_perspective=Perspective
setting_perspective_hint=Outside: objects are drawn where they really are. Pilot: you see what the pilot would see, with delayed light and aberration (realistic, harder). V switches in game.
perspective_outside=Outside
perspective_pilot=Pilot (realistic)
setting_tactical_overlay=Tactical computer
setting_tactical_overlay_hint=Draws outlines of where things really are, with velocity arrows, over the view. Pilot: only in the realistic pilot perspective. T switches it in game.
setting_tactical_laser_damage=Laser damage multiplier
setting_tactical_laser_damage_hint=Shows what a shot would do to the aimed target (Doppler-scaled photon damage) next to the target, green above x1 and red below. Needs relativity and the tactical computer.
setting_tactical_target_rings=Target rings
setting_tactical_target_rings_hint=Glowing red rings around every asteroid and enemy ship you must destroy to clear the level, drawn by the ship computer at their true positions.
setting_tactical_intercept_markers=Intercept markers
setting_tactical_intercept_markers_hint=Rings showing where to point so a laser hits the nearest targets, from the muzzle. Needs the tactical computer intercept tier.
tactical_overlay_off=Off
tactical_overlay_pilot=Pilot view only
tactical_overlay_always=Always
setting_relativity=Relativity
setting_relativity_hint=On: speed is capped by the speed of light, and time and space stretch near it. Off: classic Newtonian physics, no speed limit.
setting_speed_of_light=Speed of light
setting_speed_of_light_hint=Higher: you can fly faster and relativity is subtle. Lower: the speed limit bites sooner and the effects show up at low speed.
setting_time_warp=Time warp
setting_time_warp_hint=On: the arena runs on the pilot's clock, so the world speeds up when you fly fast. Off: world time always runs at normal speed.
setting_target_pointers=Target pointers
setting_target_pointers_hint=On: arrows at the screen edge point at off-screen targets. Off: no arrows.
setting_grid=Reference grid
setting_grid_hint=On: a background grid makes your motion visible. Off: plain starfield only.
setting_master_volume=Master volume
setting_master_volume_hint=Overall loudness of all game sounds.
setting_hull_sound_volume=Hull sounds
setting_hull_sound_volume_hint=Loudness of what the ship itself makes: engine rumble, guns, impacts and scrapes.
setting_computer_sounds=Computer sounds
setting_computer_sounds_hint=On: the ship's computer turns what it sees into sound, e.g. asteroids breaking up, played when their light reaches you. Off: the realistic silent vacuum.
setting_computer_sound_volume=Computer sound volume
setting_computer_sound_volume_hint=Loudness of the computer's sonification of distant events.
