name: Deploy web build to GitHub Pages

# Manual only: Actions tab -> "Deploy web build to GitHub Pages" -> Run workflow.
on:
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    deploy:
        name: Build TeaVM bundle and deploy
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            -   uses: actions/checkout@v4

            -   uses: actions/setup-java@v4
                with:
                    java-version: "25"
                    distribution: temurin

            -   uses: gradle/actions/setup-gradle@v4

            -   name: Build web bundle
                run: ./gradlew teavm:generateJavaScript

            -   uses: actions/upload-pages-artifact@v3
                with:
                    path: teavm/build/dist/js/webapp

            -   id: deployment
                uses: actions/deploy-pages@v4
