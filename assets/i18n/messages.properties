scenario_flight_school_title=Flight school
scenario_flight_school_summary=Steering, thrust and the guns, in a small room with a few rocks.
scenario_flight_school_briefing=Move the mouse to turn the ship toward the pointer. Hold the right mouse button to fire the engine. There is no friction in space: to stop, turn around and thrust the other way.\n\nThe guns pick their own targets and fire when one is in range; hold the left mouse button to fire straight ahead as well. Big asteroids break into small ones. Destroy every red-ringed target to finish.\n\nThe mouse wheel zooms. The soft wall at the edge of the arena pushes you back in.
scenario_combat_title=Weapons and enemies
scenario_combat_summary=Two enemy ships and some cover. Learn the targeting computer.
scenario_combat_briefing=Enemy ships hunt you and shoot back. Like you, they only see where your light shows you, which is where you were a moment ago, so keep moving and change course often.\n\nThe ship computer draws a red ring around every target and an arrow at the screen edge toward targets off screen. The top right corner counts the targets left. Press T to toggle the tactical computer, which draws targets at their true positions.\n\nUse the asteroids as cover, and do not fly in a straight line for long.
scenario_relativity_title=Relativity
scenario_relativity_summary=Light is slow here (c = 10). See the speed limit, time warp and light delay.
scenario_relativity_briefing=In this arena light travels only 10 units per second. Thrust for a while: your speed climbs toward c but never reaches it, and the HUD shows \u03B2 (your speed as a fraction of c) and \u03B3 (how much your clock slows down).\n\nTime warp: the arena runs on your ship's clock, so the world speeds up around you when you fly fast.\n\nPress V for the pilot view, which shows only what your eyes can see: every rock where it was when its light left it. The tactical computer (T) draws their true positions on top. The rocks here are fast, so the two differ a lot.
scenario_gravity_title=Gravity
scenario_gravity_summary=A black hole and a planet pull on everything, you included.
scenario_gravity_briefing=Every path bends here. The black hole on the right pulls hardest. Nothing comes back from its horizon, and the HUD warns about tidal stress when you get too close. The planet on the left pulls too, and casts a shadow.\n\nThe asteroids start at rest and will slowly fall. Destroy them before the hole swallows them, or watch where they go. Use gravity: a close pass gives a free turn.
